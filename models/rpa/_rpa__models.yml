version: 2

models:
  - name: rpa_fiatteringen_zorgregels
    description: >
      Zorgregels verrijkt met RPA/rooster-checks tegen ORTEC — alléén nog-niet-gefiatteerde
      regels (is_gefiatteerd = 0), bedoeld om openstaand werk te screenen vóór fiattering.
      Eén rij per zorgregel. Bovenop mart_zorgregels toegevoegd: rooster_match_beschrijving
      (had de medewerker die dag een dienst?) en is_rooster_match (had die dienst ook
      daadwerkelijk TIME_AT_WORK > 0, dus echte werkdag i.p.v. ziek/verlof/standby).
    columns:
      - name: zorgregel_id
        description: "Unieke identifier van de zorgregel"
        tests: [unique, not_null]
      - name: client_id
        description: "Verwijzing naar de cliënt. Null = indirecte zorg"
      - name: clientnummer
        description: "Extern cliëntnummer (identificationNo) uit ONS. Enkel voor debugging."
      - name: medewerker_id
        description: "Verwijzing naar de medewerker. Null = geen medewerker"
      - name: personeelsnummer
        description: "Personeelsnummer van de medewerker. Enkel voor debugging."
      - name: medewerker_naam
        description: "Volledige naam van de medewerker (voornaam + achternaam). Enkel voor debugging."
      - name: activiteit_id
        description: "Verwijzing naar de activiteit/uursoort"
      - name: uursoort_beschrijving
        description: "Naam/omschrijving van de uursoort"
      - name: team_id
        description: "Verwijzing naar het team dat de zorgregel heeft geregistreerd"
      - name: teamnaam
        description: "Naam van het team (join op stg_onsdb__teams)"
      - name: starttijd
        description: "Starttijd van de zorgregel (na afronding)"
      - name: eindtijd
        description: "Eindtijd van de zorgregel (na afronding)"
      - name: datum
        description: "Datum afgeleid uit starttijd"
      - name: duur_minuten
        description: "Duur in minuten (eindtijd - starttijd)"
      - name: is_gefiatteerd
        description: "Altijd 0 in deze tabel (filter)"
      - name: gefiatteerd_op
        description: "Moment waarop de zorgregel gefiatteerd is"
      - name: is_urenregistratie
        description: "1 als dit een urenregistratie is"
      - name: rooster_match_beschrijving
        description: >
          Check of de medewerker op de zorgregel-datum een ORTEC-dienst had.
          Waarden: 'Match' (dienst aanwezig), 'Geen dienst' (medewerker wel in ORTEC,
          maar geen dienst op die dag), 'Medewerker niet in ORTEC' (geen ORTEC-profiel
          of geen enkele dienst bekend), 'Geen medewerker' (zorgregel zonder medewerker,
          indirecte zorg).
      - name: is_rooster_match
        description: >
          1 als de medewerker op de zorgregel-datum een ORTEC-dienst had mét
          TIME_AT_WORK > 0 (echte werkdag), anders 0. Dus ook 0 bij ziek/verlof/standby,
          geen dienst, geen ORTEC-profiel of geen medewerker.
      - name: aangemaakt_op
        description: "Moment van aanmaken"
      - name: gewijzigd_op
        description: "Moment van laatste wijziging"
