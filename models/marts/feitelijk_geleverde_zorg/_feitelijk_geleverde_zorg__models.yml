version: 2

models:
  - name: mart_feitelijk_geleverde_zorg
    description: >
      Verantwoording feitelijk geleverde zorg per client in zorg (snapshot vandaag).
      Bevat checks op geldig zorgplan, recente rapportages, medicatietoediening en
      zorgplaninzage, plus een totaalscore. Eén rij per client in zorg.
    columns:
      - name: client_id
        description: "Unieke identifier van de client"
        tests: [unique, not_null]
      - name: client_naam
        description: "Naam van de client (roepnaam + achternaam)"
      - name: geldig_zorgplan
        description: "1 als client een actief zorgplan heeft op peildatum, anders 0"
      - name: recente_rapportages
        description: "1 als client minstens 1 rapportage heeft in evaluatieperiode, anders 0"
      - name: medicatie_toegediend
        description: "1 als medicatie correct toegediend, 0 als niet, NULL als geen medicatie"
      - name: zorgplan_ingezien
        description: "1 als zorgplan ingezien door relevant zorgpersoneel op dezelfde locatie, anders 0"
      - name: client_score
        description: "Score als fractie tussen 0 en 1 (bv. 0.67) over alle van toepassing zijnde checks"
      - name: peildatum
        description: "Gebruikte peildatum voor de berekening"
      - name: startdatum
        description: "Begin van de evaluatieperiode (peildatum - 28 dagen)"

  - name: mart_feitelijk_geleverde_zorg_datapunten
    description: >
      Long-format variant van mart_feitelijk_geleverde_zorg: één rij per client per
      datapunt. Bedoeld voor Power BI, zodat datapunten als dimensie gebruikt kunnen
      worden (as, slicer, matrix) in plaats van één measure per datapunt.
      Grain: client_id + datapunt (4 rijen per client in zorg).
      Locatie komt via de relatie op client_id, niet uit deze mart.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - client_id
              - datapunt
    columns:
      - name: client_id
        description: "Unieke identifier van de client"
        tests: [not_null]
      - name: datapunt
        description: "Technische naam van het datapunt, gelijk aan de kolomnaam in mart_feitelijk_geleverde_zorg"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - geldig_zorgplan
                  - recente_rapportages
                  - medicatie_toegediend
                  - zorgplan_ingezien
          - relationships:
              arguments:
                to: ref('mart_feitelijk_geleverde_zorg_normen')
                field: datapunt
      - name: datapunt_label
        description: "Leesbare naam van het datapunt, voor weergave in Power BI"
      - name: datapunt_volgorde
        description: "Sorteervolgorde van het datapunt (gebruik als 'sort by column' voor datapunt_label)"
      - name: waarde
        description: >
          1 als het datapunt behaald is, 0 als niet, NULL als niet van toepassing
          (alleen mogelijk bij medicatie_toegediend). NULL telt niet mee in een
          AVERAGE, waardoor het gemiddelde direct het slagingspercentage geeft.
      - name: peildatum
        description: "Gebruikte peildatum voor de berekening"

  - name: mart_feitelijk_geleverde_zorg_normen
    description: >
      Normen (streefwaarden) per datapunt voor de verantwoording feitelijk geleverde zorg.
      Kleine statische dimensietabel, tevens de plek waar de leesbare naam en sorteervolgorde
      van elk datapunt vastliggen. Koppelt op `datapunt` aan
      mart_feitelijk_geleverde_zorg_datapunten. Grain: één rij per datapunt.
      De normwaarden zijn organisatiebeleid en worden in het model zelf onderhouden.
    columns:
      - name: datapunt
        description: "Technische naam van het datapunt, gelijk aan de kolomnaam in mart_feitelijk_geleverde_zorg"
        tests: [unique, not_null]
      - name: datapunt_label
        description: "Leesbare naam van het datapunt, voor weergave in Power BI"
      - name: datapunt_volgorde
        description: "Sorteervolgorde van het datapunt (gebruik als 'sort by column' voor datapunt_label)"
      - name: norm
        description: >
          Streefwaarde als fractie tussen 0 en 1 (bv. 0.90), net als client_score in
          mart_feitelijk_geleverde_zorg. Power BI formatteert dit als percentage.
        tests: [not_null]
