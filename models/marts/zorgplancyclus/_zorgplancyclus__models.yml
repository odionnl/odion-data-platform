version: 2

models:
  - name: mart_integratief_persoonsbeeld_per_client
    description: >
      IPB-status per cliënt in zorg (snapshot vandaag). Eén rij per cliënt uit
      mart_clienten_actueel, met aantallen IPB-vragenlijsten per status
      (Actueel / Concept / Gearchiveerd) en een samenvattende categorie.
      IPB is van toepassing voor cliënten die voldoen aan minstens één van:
      (a) actief ZZP-product uit de IPB-doelgroep (VG 5-8, LG 4-7,
      ZG aud 2-3, ZG vis 2-3), of (b) hoofdlocatie onder niveau4 in de
      IPB-locatielijst (Dynamica ODC, Boomgaard ODC de, Gezinsbehandeling).
      Voor overige cliënten is ipb_status 'Niet van toepassing'.
    columns:
      - name: client_id
        description: "Unieke identifier van de cliënt"
        tests: [unique, not_null]
      - name: clientnummer
        description: "Extern cliëntnummer (identificationNo) uit ONS"
      - name: clientnaam
        description: "Volledige naam van de cliënt"
      - name: hoofdlocatie_id
        description: "Locatie-ID van de huidige hoofdlocatie (type MAIN)"
      - name: hoofdlocatienaam
        description: "Naam van de huidige hoofdlocatie"
      - name: hoofdlocatienaam_niveau4
        description: "Niveau4-naam van de hoofdlocatie (ancestor in int_locatie_hierarchie; null als de hoofdlocatie boven niveau 4 hangt)"
      - name: actuele_productcodes
        description: "Actieve productcodes van de cliënt, alfabetisch gesorteerd en gescheiden door ' | ' (null als er geen actieve producten zijn)"
      - name: ipb_van_toepassing
        description: >
          1 als IPB van toepassing is voor de cliënt (actief ZZP-product uit de
          IPB-doelgroep óf hoofdlocatie onder een niveau4 uit de IPB-locatielijst),
          anders 0.
      - name: aantal_ipb_actueel
        description: "Aantal IPB-vragenlijsten met status 'Actueel' (0 als er geen zijn)"
      - name: aantal_ipb_concept
        description: "Aantal IPB-vragenlijsten met status 'Concept' (0 als er geen zijn)"
      - name: aantal_ipb_gearchiveerd
        description: "Aantal IPB-vragenlijsten met status 'Gearchiveerd' (0 als er geen zijn)"
      - name: ipb_status
        description: >
          Samenvattende categorie:
          'Niet van toepassing' (geen actief ZZP-product uit de IPB-doelgroep én geen hoofdlocatie in de IPB-locatielijst),
          'Actueel' (minstens één Actueel),
          'Concept' (geen Actueel, wel Concept),
          'Gearchiveerd' (alleen Gearchiveerd),
          'Geen' (geen enkele IPB-vragenlijst voltooid).

  - name: mart_levensloop_per_client
    description: >
      Levensloop-status per cliënt in zorg (snapshot vandaag). Eén rij per
      cliënt uit mart_clienten_actueel, met aantallen Levensloop-vragenlijsten
      per status (Actueel / Concept / Gearchiveerd) en een samenvattende
      categorie. Een Actuele Levensloop die meer dan 1 jaar niet is bijgewerkt
      (gewijzigd_op > 1 jaar geleden) krijgt categorie 'Verlopen'. Geen
      doelgroep-filter — alle cliënten in zorg.
    columns:
      - name: client_id
        description: "Unieke identifier van de cliënt"
        tests: [unique, not_null]
      - name: clientnummer
        description: "Extern cliëntnummer (identificationNo) uit ONS"
      - name: clientnaam
        description: "Volledige naam van de cliënt"
      - name: hoofdlocatie_id
        description: "Locatie-ID van de huidige hoofdlocatie (type MAIN)"
      - name: hoofdlocatienaam
        description: "Naam van de huidige hoofdlocatie"
      - name: hoofdlocatienaam_niveau4
        description: "Niveau4-naam van de hoofdlocatie (ancestor in int_locatie_hierarchie; null als de hoofdlocatie boven niveau 4 hangt)"
      - name: aantal_levensloop_actueel
        description: "Aantal Levensloop-vragenlijsten met status 'Actueel' (0 als er geen zijn)"
      - name: aantal_levensloop_concept
        description: "Aantal Levensloop-vragenlijsten met status 'Concept' (0 als er geen zijn)"
      - name: aantal_levensloop_gearchiveerd
        description: "Aantal Levensloop-vragenlijsten met status 'Gearchiveerd' (0 als er geen zijn)"
      - name: laatst_bijgewerkt_actueel
        description: "Tijdstip van de laatste wijziging (gewijzigd_op) op een Actuele Levensloop (null als er geen Actuele is). Sleutel voor de 'Verlopen'-categorie (> 1 jaar geleden)."
      - name: nieuwe_vragen_gevuld
        description: >
          1 als de cliënt op een Actuele Levensloop een gevuld tekst_antwoord heeft
          op alle drie de 'nieuwe' vragen (praktische informatie, gebeurtenis met
          invloed op dagelijks leven, palliatieve wensen). 0 anders.
      - name: levensloop_status
        description: >
          Samenvattende categorie:
          'Actueel' (minstens één Actueel, binnen 1 jaar bijgewerkt),
          'Verlopen' (Actueel maar laatst bijgewerkt > 1 jaar geleden),
          'Concept' (geen Actueel, wel Concept),
          'Gearchiveerd' (alleen Gearchiveerd),
          'Geen' (geen enkele Levensloop-vragenlijst voltooid).

  - name: mart_zorgplan_voortgang_per_client
    description: >
      Zorgplan-voortgang per cliënt in zorg (snapshot vandaag). Eén rij per
      cliënt uit mart_clienten_actueel. Per cliënt de zorgplan_versie
      (Nieuw/Oud/Mix/Leeg/Geen) en zorgplan_status (Actueel/Concept/Verlopen/Geen)
      op basis van status_omschrijving + geldigheid van het Actuele en Concept
      zorgplan. Invariant: maximaal 1 Actief en 1 Concept zorgplan per cliënt.
    columns:
      - name: client_id
        description: "Unieke identifier van de cliënt"
        tests: [unique, not_null]
      - name: clientnummer
        description: "Extern cliëntnummer (identificationNo) uit ONS"
      - name: clientnaam
        description: "Volledige naam van de cliënt"
      - name: hoofdlocatie_id
        description: "Locatie-ID van de huidige hoofdlocatie (type MAIN)"
      - name: hoofdlocatienaam
        description: "Naam van de huidige hoofdlocatie"
      - name: hoofdlocatienaam_niveau4
        description: "Niveau4-naam van de hoofdlocatie (ancestor in int_locatie_hierarchie; null als de hoofdlocatie boven niveau 4 hangt)"
      - name: zorgplan_versie
        description: >
          Versie van het Actuele zorgplan op basis van de domeinen van de
          zorgplanregels: 'Nieuw', 'Oud', 'Mix' of 'Leeg' (geen geldige regels).
          Fallback naar het Concept zorgplan als er geen Actueel is.
          'Geen' als de cliënt geen Actueel én geen Concept zorgplan heeft.
      - name: zorgplan_status
        description: >
          Samenvattende status:
          'Actueel' (Actief plan met geldigheid 'Geldig' of 'Nog niet gestart'),
          'Verlopen' (Actief plan met geldigheid 'Verlopen'),
          'Concept' (geen Actief plan, wel een Concept),
          'Geen' (geen Actief en geen Concept zorgplan).
      - name: ondersteuningsvragen_gearchiveerd
        description: >
          Check op vragenlijst-administratie. 'Ja' als er geen Actuele of Concept
          versie van "Ondersteuningsvragen voor volwassenen" meer aanwezig is.
          'Nee' als er nog wel een Actuele/Concept versie open staat.
          'Niet van toepassing' als de check niet relevant is (zorgplan_versie
          niet 'Nieuw' of zorgplan_status niet 'Actueel').
      - name: persoonsbeeld_gearchiveerd
        description: >
          Check op vragenlijst-administratie. 'Ja' als er geen Actuele of Concept
          versie van "Persoonsbeeld, bejegening, signaleringsplan" meer aanwezig
          is. 'Nee' als er nog wel een Actuele/Concept versie open staat.
          'Niet van toepassing' als de check niet relevant is (zorgplan_versie
          niet 'Nieuw' of zorgplan_status niet 'Actueel').

  - name: mart_zorgplan_verantwoording_per_client
    description: >
      Zorgplan-verantwoording-status per cliënt in zorg (snapshot vandaag).
      Eén rij per cliënt uit mart_clienten_actueel, met aantallen vragenlijsten
      "Zorgplan, welke keuzes hebben we gemaakt?" per status (Actueel /
      Concept / Gearchiveerd) en een samenvattende categorie. Een Actuele
      vragenlijst die meer dan 1 jaar niet is bijgewerkt (gewijzigd_op > 1 jaar
      geleden) krijgt categorie 'Verlopen'. Geen doelgroep-filter — alle
      cliënten in zorg.
    columns:
      - name: client_id
        description: "Unieke identifier van de cliënt"
        tests: [unique, not_null]
      - name: clientnummer
        description: "Extern cliëntnummer (identificationNo) uit ONS"
      - name: clientnaam
        description: "Volledige naam van de cliënt"
      - name: hoofdlocatie_id
        description: "Locatie-ID van de huidige hoofdlocatie (type MAIN)"
      - name: hoofdlocatienaam
        description: "Naam van de huidige hoofdlocatie"
      - name: hoofdlocatienaam_niveau4
        description: "Niveau4-naam van de hoofdlocatie (ancestor in int_locatie_hierarchie; null als de hoofdlocatie boven niveau 4 hangt)"
      - name: aantal_zorgplan_verantwoording_actueel
        description: "Aantal vragenlijsten met status 'Actueel' (0 als er geen zijn)"
      - name: aantal_zorgplan_verantwoording_concept
        description: "Aantal vragenlijsten met status 'Concept' (0 als er geen zijn)"
      - name: aantal_zorgplan_verantwoording_gearchiveerd
        description: "Aantal vragenlijsten met status 'Gearchiveerd' (0 als er geen zijn)"
      - name: laatst_bijgewerkt_actueel
        description: "Tijdstip van de laatste wijziging (gewijzigd_op) op een Actuele vragenlijst (null als er geen Actuele is). Sleutel voor de 'Verlopen'-categorie (> 1 jaar geleden)."
      - name: zorgplan_verantwoording_status
        description: >
          Samenvattende categorie:
          'Actueel' (minstens één Actueel, binnen 1 jaar bijgewerkt),
          'Verlopen' (Actueel maar laatst bijgewerkt > 1 jaar geleden),
          'Concept' (geen Actueel, wel Concept),
          'Gearchiveerd' (alleen Gearchiveerd),
          'Geen' (geen enkele vragenlijst voltooid).
