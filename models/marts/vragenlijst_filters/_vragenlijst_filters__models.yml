version: 2

models:
  - name: mart_vragenlijst_antwoorden_intake_en_wachtlijst_3_0
    description: >
      Antwoorden op de vragenlijst "Intake en wachtlijst 3.0".
      Gefilterde subset van mart_vragenlijst_antwoorden (vragenlijst_titel =
      'Intake en wachtlijst 3.0'). Gematerialiseerd als view; kolommen en
      betekenis zijn identiek aan mart_vragenlijst_antwoorden. Eén rij per antwoord.
    columns:
      - name: vragenlijst_antwoord_id
        description: "Unieke identifier van het antwoord"
        tests: [unique, not_null]

  - name: mart_vragenlijst_antwoorden_integratief_persoonsbeeld
    description: >
      Antwoorden op de vragenlijst "Integratief persoonsbeeld".
      Gefilterde subset van mart_vragenlijst_antwoorden (vragenlijst_titel =
      'Integratief persoonsbeeld'). Gematerialiseerd als view; kolommen en
      betekenis zijn identiek aan mart_vragenlijst_antwoorden. Eén rij per antwoord.
    columns:
      - name: vragenlijst_antwoord_id
        description: "Unieke identifier van het antwoord"
        tests: [unique, not_null]

  - name: mart_vragenlijst_resultaten_integratief_persoonsbeeld
    description: >
      Ingevulde vragenlijsten met titel "Integratief persoonsbeeld".
      Gefilterde subset van mart_vragenlijst_resultaten (vragenlijst_titel =
      'Integratief persoonsbeeld'). Gematerialiseerd als view; kolommen en
      betekenis zijn identiek aan mart_vragenlijst_resultaten.
      Eén rij per ingevulde vragenlijst.
    columns:
      - name: vragenlijst_resultaat_id
        description: "Unieke identifier van de ingevulde vragenlijst"
        tests: [unique, not_null]
