    description: >
      Antwoorden op de vragenlijst "Intake en wachtlijst 3.0".
      Gefilterde subset van mart_vragenlijst_antwoorden (vragenlijst_titel =
      'Intake en wachtlijst 3.0'). Gematerialiseerd als view; kolommen en
      betekenis zijn identiek aan mart_vragenlijst_antwoorden. Eén rij per antwoord.
    columns:
      - name: vragenlijst_antwoord_id
        description: "Unieke identifier van het antwoord"
        tests: [unique, not_null]

